[package]
name = "c2_server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30.2", features = ["serde"] }
crossterm = "0.29.0"
color-eyre = "0.6.5"
reqwest = { version = "0.13.5", features = ["json"] }
pulldown-cmark = { version = "0.13.6", default-features = false }